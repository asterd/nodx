[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodx"
version = "1.0.0"
description = "Python parser and canonical projections for NODX documents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
