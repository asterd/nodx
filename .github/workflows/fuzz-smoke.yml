name: Fuzz smoke

on:
  workflow_dispatch:
    inputs:
      runs:
        description: libFuzzer runs per target
        required: false
        default: "5000"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz smoke
        env:
          NODX_FUZZ_RUNS: ${{ inputs.runs || '5000' }}
        run: sh scripts/fuzz_smoke.sh
