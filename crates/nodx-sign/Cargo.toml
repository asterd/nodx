[package]
name = "nodx-sign"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "NODX 1.0 signature verifier with strict JWS header processing and trust policy"

[lib]
name = "nodx_sign"
path = "src/lib.rs"

[dependencies]
nodx-core = { path = "../nodx-core" }
nodx-package = { path = "../nodx-package" }
nodx-url = { path = "../nodx-url" }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
serde_json = "1"
